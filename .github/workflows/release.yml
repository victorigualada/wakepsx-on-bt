name: Release

# Runs on its own when a release is published on GitHub. Create the release from
# the latest commit of main, with a tag like v1.2.3, and write the notes as usual.
#
# 1. Bumps the version on main to the tag's (manifest, ESPHome project version,
#    pinned package examples in the docs).
# 2. Adds a commit only the tag points to, where the ESPHome package pulls the
#    external component from that same tag instead of main, and moves the tag
#    there. Pinning the package (…/wakepsx-on-bt.yaml@vX.Y.Z) then pins the
#    component too, and HACS installs the bumped version.
#
# The release itself (title, notes, assets) is left as published.

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency: release

jobs:
  pin:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check the tag
        id: check
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3, got '$TAG'"; exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if git show "$TAG:esphome/wakepsx-on-bt.yaml" | grep -qx "  wakepsx_ref: $TAG"; then
            echo "$TAG already pins the component; nothing to do."
            echo "done=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$TAG does not point at the latest commit of main. Delete the release and the tag, and publish it again from main."
            exit 1
          fi

      - name: Bump the version on main
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          import json, os
          path = "custom_components/wakepsx_on_bt/manifest.json"
          manifest = json.load(open(path))
          manifest["version"] = os.environ["VERSION"]
          with open(path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          sed -i -E "s/^(    version: )\"[^\"]*\"/\1\"$VERSION\"/" esphome/wakepsx-on-bt.yaml esphome/README.md
          sed -i -E "s/(wakepsx-on-bt\.yaml@)v[0-9]+\.[0-9]+\.[0-9]+/\1$TAG/g" README.md esphome/README.md

          git add custom_components esphome README.md
          if git diff --cached --quiet; then
            echo "main is already at $VERSION"
          else
            git commit -m "Release $TAG"
            git push origin HEAD:main
          fi

      - name: Pin the component and move the tag
        if: steps.check.outputs.done != 'true'
        run: |
          sed -i -E "s/^  wakepsx_ref: main$/  wakepsx_ref: $TAG/" esphome/wakepsx-on-bt.yaml
          grep -qx "  wakepsx_ref: $TAG" esphome/wakepsx-on-bt.yaml || {
            echo "::error::Could not set wakepsx_ref in esphome/wakepsx-on-bt.yaml"; exit 1
          }
          git commit -am "Pin the ESPHome component to $TAG"
          git tag -fa "$TAG" -m "$TAG"
          git push --force origin "refs/tags/$TAG"
