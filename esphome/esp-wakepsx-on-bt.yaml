# ==============================================================================
# Wake PSX on Bluetooth: complete node configuration.
#
# Copy this file into your ESPHome config folder (or let the ESPHome dashboard
# adopt the device), fill in secrets.yaml, and flash. Everything else comes from
# the remote package below.
# ==============================================================================
substitutions:
  name: esp-wakepsx-on-bt
  friendly_name: Wake PSX on Bluetooth

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  wakepsx: github://victorigualada/wakepsx-on-bt/esphome/wakepsx-on-bt.yaml@main

dashboard_import:
  package_import_url: github://victorigualada/wakepsx-on-bt/esphome/esp-wakepsx-on-bt.yaml@main
  import_full_config: false

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:
