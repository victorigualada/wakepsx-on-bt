# ==============================================================================
# Wake PSX on Bluetooth: complete node configuration.
#
# Copy this file into your ESPHome config folder, make sure secrets.yaml has
# api_encryption_key, wifi_ssid and wifi_password, and flash. Everything else comes from
# the remote package below.
# ==============================================================================
substitutions:
  name: esp-wakepsx-on-bt
  friendly_name: Wake PSX on Bluetooth
  # Optional: MACs for the "Wake console" button on the first boot. You can also
  # set them later from the device page in Home Assistant. Read them with
  # https://victorigualada.github.io/wakepsx-on-bt/
  # controller_mac: "AA:BB:CC:DD:EE:FF"
  # console_mac: "11:22:33:44:55:66"
  # Optional: the console's IP for the Console state sensors. You can also set
  # it later from the device page (Console IP).
  # console_ip: "192.168.1.105"
  # Optional: the devices you play Remote Play from (IPs and ranges, separated
  # by commas), to wake the console when you open it there. You can also set
  # them later (Remote Play IPs).
  # remote_play_ip: "192.168.1.102, 192.168.1.200-210"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  wakepsx: github://victorigualada/wakepsx-on-bt/esphome/wakepsx-on-bt.yaml@main

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:
