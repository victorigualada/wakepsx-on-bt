# ==============================================================================
# Wake PSX on Bluetooth: ESPHome package
#
# Pull it straight from GitHub; nothing to download or copy:
#
#   packages:
#     wakepsx: github://victorigualada/wakepsx-on-bt/esphome/wakepsx-on-bt.yaml@main
#
# Requirements: classic ESP32 (WROOM/WROVER), ESP-IDF framework. S2/S3/C3/C6/H2
# have no Bluetooth Classic and are rejected at validation time.
# ==============================================================================
substitutions:
  # Git ref the external component is pulled from. "main" here; in a release
  # tag the release workflow sets it to that same tag, so pinning the package
  # (…/wakepsx-on-bt.yaml@vX.Y.Z) also pins the component. Override it only to
  # mix versions on purpose.
  wakepsx_ref: main
  # MACs the "Wake console" button uses on the first boot. Leave them empty and
  # set them from the device page in Home Assistant instead (Controller MAC /
  # Console MAC); after that the values saved on the ESP32 win over these.
  controller_mac: ""
  console_mac: ""
  # Console IP for the Console state sensors on the first boot. Leave it empty
  # and set it from the device page (Console IP) instead; after that the value
  # saved on the ESP32 wins. Give the console a fixed IP (DHCP reservation).
  console_ip: ""
  # IP of the device you play from (Apple TV with Asobi, phone with PS Remote
  # Play...) for Remote Play request on the first boot. Leave it empty and set it
  # from the device page (Remote Play IP) instead. Give it a fixed IP too.
  remote_play_ip: ""

esphome:
  # The Home Assistant integration finds the node by this project name
  # (device model "esp-wakepsx-on-bt"). Keep the part after the dot.
  project:
    name: "victorigualada.esp-wakepsx-on-bt"
    version: "0.4.1"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://victorigualada/wakepsx-on-bt@${wakepsx_ref}
    components: [wakepsx_on_bt]

# Brings up the Classic BT controller through Virtual HCI and sets the sdkconfig
# options it needs. Creates the "PSX Wake Status" text sensor.
wakepsx_on_bt:
  id: wakepsx
  # Asks the console every 10 s whether it is on, in rest mode or off (UDP to
  # port 9302/987 at its IP, like the PS Remote Play app). No account needed.
  console:
    address: !lambda return id(wakepsx_console_ip).state;
    state:
      name: "Console state"
    power:
      id: wakepsx_console_power
      name: "Console power"
    host_name:
      name: "Console name"
    system_version:
      name: "Console firmware"
    # On while the device at Remote Play IP keeps asking for the console over
    # ARP and gets no answer: the Remote Play app was opened and the console is
    # asleep. Wakes it right away if Auto wake on Remote Play is on.
    remote_play:
      address: !lambda return id(wakepsx_remote_play_ip).state;
      request:
        name: "Remote Play request"
        on_press:
          - if:
              condition:
                and:
                  - switch.is_on: wakepsx_auto_wake
                  - binary_sensor.is_off: wakepsx_console_power
              then:
                - logger.log: "Remote Play request: waking the console"
                - button.press: wakepsx_wake_button

# The two MACs the ESP32 needs, editable from the device page in Home Assistant
# and saved in flash. Read them with the page linked in the README (controller
# over USB, Chrome or Edge), or let the integration fill them in: every wake it
# sends through this node stores the MACs it used here.
text:
  - platform: template
    id: wakepsx_controller_mac
    name: "Controller MAC"
    icon: mdi:controller
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${controller_mac}"
    max_length: 17
    pattern: "^$|^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$"
  - platform: template
    id: wakepsx_console_mac
    name: "Console MAC"
    icon: mdi:sony-playstation
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${console_mac}"
    max_length: 17
    pattern: "^$|^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$"
  # Where the Console state sensors ask. Empty: they read "No IP".
  - platform: template
    id: wakepsx_console_ip
    name: "Console IP"
    icon: mdi:ip-network
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${console_ip}"
    max_length: 15
    pattern: "^$|^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$"

  # The device that looks for the console (see Remote Play request). Empty: off.
  - platform: template
    id: wakepsx_remote_play_ip
    name: "Remote Play IP"
    icon: mdi:television-play
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${remote_play_ip}"
    max_length: 15
    pattern: "^$|^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$"

# Off: Remote Play request is only reported, Home Assistant decides what to do.
switch:
  - platform: template
    id: wakepsx_auto_wake
    name: "Auto wake on Remote Play"
    icon: mdi:power-sleep
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# Wakes the console with the MACs above. Missing or malformed MACs show up as
# "Invalid MAC" on the status sensor.
button:
  - platform: template
    id: wakepsx_wake_button
    name: "Wake console"
    icon: mdi:power
    on_press:
      - wakepsx_on_bt.wake:
          dsx_mac: !lambda return id(wakepsx_controller_mac).state;
          psx_mac: !lambda return id(wakepsx_console_mac).state;

# Action called by the Home Assistant integration (esphome.<node>_wake_psx).
# Optional: the button above works without the integration.
api:
  actions:
    - action: wake_psx
      variables:
        dsx_mac: string # MAC of the controller paired with the console (spoofed)
        psx_mac: string # MAC of the console to wake
      then:
        - text.set:
            id: wakepsx_controller_mac
            value: !lambda return std::string(dsx_mac);
        - text.set:
            id: wakepsx_console_mac
            value: !lambda return std::string(psx_mac);
        - wakepsx_on_bt.wake:
            dsx_mac: !lambda return std::string(dsx_mac);
            psx_mac: !lambda return std::string(psx_mac);
